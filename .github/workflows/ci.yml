name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test --project SptPrometheusExporter.Tests -c Release

  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Shallow clone without LFS: the mod only needs the server's C# projects, not its
      # LFS-tracked database files, so this stays around 330 MB instead of 1.6 GB.
      - name: Clone server repository
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git clone --depth 1 https://github.com/SP-Tushonka/server-csharp.git "$RUNNER_TEMP/server-csharp"
      - name: Build mod
        run: dotnet build SptPrometheusExporter/SptPrometheusExporter.csproj -c Release -p:ServerRepoDir="$RUNNER_TEMP/server-csharp"
